name: Supply chain

on:
    pull_request:
    merge_group:
    push:
        branches: [main]
    schedule:
        - cron: "17 7 * * 1"
    workflow_call:

permissions:
    contents: read

jobs:
    dependency-review:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
        steps:
            - uses: actions/checkout@v7
            - uses: actions/dependency-review-action@v5
              with:
                  config-file: ./.github/dependency-review-config.yml

    osv-pr:
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.6.0
        permissions:
            actions: read
            contents: read
            security-events: write

    osv-full:
        if: github.event_name == 'workflow_call' || github.event_name == 'schedule'
        uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.6.0
        permissions:
            actions: read
            contents: read
            security-events: write

    license-notice-gate:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - name: Install dependencies
              run: bun install --frozen-lockfile
            - name: Embedding compliance manifest gate
              run: node scripts/check-embedding-manifest.mjs
            - name: License and NOTICE gate
              run: bun scripts/supply-chain/evaluate.ts gate --sbom sbom.local.cdx.json
            - uses: actions/upload-artifact@v7
              with:
                  name: local-cyclonedx
                  path: sbom.local.cdx.json

    sbom:
        runs-on: ubuntu-latest
        permissions:
            actions: read
            attestations: write
            contents: write
            id-token: write
        steps:
            - uses: actions/checkout@v7
            - uses: anchore/sbom-action@v0
              with:
                  path: .
                  format: cyclonedx-json
                  artifact-name: autorag-cyclonedx.json
                  output-file: autorag.cdx.json
                  upload-artifact: true
                  upload-release-assets: false
                  dependency-snapshot: ${{ github.event_name != 'pull_request' }}
            - uses: anchore/sbom-action@v0
              with:
                  path: .
                  format: spdx-json
                  artifact-name: autorag-spdx.json
                  output-file: autorag.spdx.json
                  upload-artifact: true
                  upload-release-assets: false
            - uses: actions/attest-sbom@v2
              if: github.event_name == 'workflow_call'
              with:
                  subject-path: autorag.cdx.json
                  sbom-path: autorag.cdx.json
