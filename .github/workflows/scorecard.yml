# OpenSSF Scorecard. publish_results only succeeds on the default branch of a
# public repo. Source pin: ossf/scorecard-action v2.4.4.
# https://github.com/ossf/scorecard-action
# https://github.com/ossf/scorecard/blob/main/.github/workflows/scorecard-analysis.yml
name: Scorecard

on:
    push:
        branches: [main]
    schedule:
        - cron: "30 1 * * 6"

permissions: read-all

jobs:
    analysis:
        name: Scorecard analysis
        runs-on: ubuntu-latest
        permissions:
            security-events: write
            id-token: write
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Run analysis
              uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
              with:
                  results_file: results.sarif
                  results_format: sarif
                  publish_results: true

            - name: Upload artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: SARIF file
                  path: results.sarif
                  retention-days: 5

            - name: Upload to code-scanning
              uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
              with:
                  sarif_file: results.sarif
