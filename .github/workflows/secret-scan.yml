# PR-diff secret scan using the MIT gitleaks CLI.
# Do not switch this job to gitleaks/gitleaks-action: that Action requires a
# GITLEAKS_LICENSE on GitHub Organization repositories.
# CLI: https://github.com/gitleaks/gitleaks/releases/tag/v8.30.1
name: Secret scan

on:
    pull_request:

permissions:
    contents: read

jobs:
    gitleaks:
        name: gitleaks (PR diff)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Install gitleaks v8.30.1
              run: |
                  set -euo pipefail
                  curl -sSfL -o /tmp/gitleaks.tgz \
                    https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
                  echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" \
                    | sha256sum -c -
                  tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
                  gitleaks version

            - name: Scan PR commits only
              env:
                  BASE: ${{ github.event.pull_request.base.sha }}
                  HEAD: ${{ github.event.pull_request.head.sha }}
              run: |
                  set -euo pipefail
                  gitleaks git --verbose --redact --no-banner \
                    --exit-code 1 \
                    --log-opts="--no-merges --first-parent ${BASE}..${HEAD}"
