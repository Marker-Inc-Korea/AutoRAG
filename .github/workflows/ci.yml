name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Named "build" to satisfy the repository's required status check.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pi-coding-agent's grep/find tools need ripgrep and fd; preinstall
      # them so tests don't depend on their on-demand binary downloads (which
      # fail in CI's network-restricted environment). On Ubuntu, the fd binary
      # is shipped as `fdfind`, which pi-coding-agent recognizes via its
      # systemBinaryNames fallback.
      - name: Install ripgrep and fd
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep fd-find

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: node_modules/.bin/biome check .

      - name: Typecheck
        run: node_modules/.bin/tsc --noEmit

      - name: Test
        run: node_modules/.bin/vitest run

      - name: Build
        run: bun run build
