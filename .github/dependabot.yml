version: 2
updates:
    - package-ecosystem: "bun" # AutoRAG 2.0 (repo root, bun.lock)
      directory: "/"
      schedule:
          interval: "weekly"
    - package-ecosystem: "bun" # Docs site (docs/, VitePress, bun.lock)
      directory: "/docs"
      schedule:
          interval: "weekly"
    - package-ecosystem: "pip" # Legacy AutoRAG (Python)
      directory: "/legacy"
      schedule:
          interval: "daily"
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
