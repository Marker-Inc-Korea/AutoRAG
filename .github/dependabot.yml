version: 2
updates:
    - package-ecosystem: "npm" # AutoRAG 2.0 (repo root)
      directory: "/"
      schedule:
          interval: "weekly"
    - package-ecosystem: "npm" # Docs site (docs/, VitePress)
      directory: "/docs"
      schedule:
          interval: "weekly"
    - package-ecosystem: "pip" # Legacy AutoRAG (Python)
      directory: "/legacy"
      schedule:
          interval: "daily"
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
